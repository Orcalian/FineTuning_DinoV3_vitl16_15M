[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = "dinov3"
exclude = '''(?x)(
  ^dinov3/tests/([^/]+/)*test_.*\.py$  # Unit tests
)'''


[tool.ruff.lint]
ignore = [
    "RUF059",
    "SIM118",
    "C408",
    "UP007",
    "FLY002",
    "S110",
    "BLE001",
    "B006",
    "RUF007",
    "SIM102",
    "SIM401",
    "TRY004",
    "SIM115",
    "SIM210",
    "UP045",
    "C419",
    "EXE002",
    "C403",
    "PIE796",
    "F401",
    "PLR1704",
    "C418",
    "B008",
    "SIM101",
    "SIM113",
    "RUF013",
    "C405",
    "C401",
    "UP031",
    "PLW0602",
    "RUF012",
    "RUF046",
    "T100",
    "E741",
    "E721",
]

[tool.pylint.master]
persistent = false
score = false

[tool.pylint.messages_control]
disable = "all"
enable = [
  "miscellaneous",
  "similarities",
]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.reports]
reports = false

[tool.pylint.miscellaneous]
notes = [
  "FIXME",
  "XXX",
  "TODO",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"hubconf.py" = ["F401"]
